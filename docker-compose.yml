services:
  ghost:
    image: ${GHOST_IMAGE:-ghost:6-alpine}
    container_name: ghost
    restart: unless-stopped
    environment:
      url: ${GHOST_URL}
      NODE_ENV: production

      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: ${GHOST_DB_PASSWORD}
      database__connection__database: ghost

      # Behind Cloudflare Tunnel — trust forwarded headers for correct client IPs.
      server__host: 0.0.0.0
      server__port: 2368

      # Mail (transactional: sign-in links, password resets, invites).
      # MAIL_HOST is either the built-in relay ("mail", see the mail service
      # below) or an external SMTP provider. Leave it unset to disable email.
      # ${MAIL_HOST:+SMTP} expands to "SMTP" only when MAIL_HOST is set.
      mail__transport: ${MAIL_HOST:+SMTP}
      mail__from: ${MAIL_FROM:-}
      mail__options__host: ${MAIL_HOST:-}
      mail__options__port: ${MAIL_PORT:-587}
      mail__options__secure: ${MAIL_SECURE:-false}
      mail__options__auth__user: ${MAIL_USER:-}
      mail__options__auth__pass: ${MAIL_PASSWORD:-}
    volumes:
      - ghost_content:/var/lib/ghost/content
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy
        # Only enforced when the built-in mail server is enabled
        # (COMPOSE_PROFILES=mail in .env).
        required: false
    networks:
      - frontend
      - backend
      - mail
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "require('http').get({host:'localhost',port:2368,path:'/ghost/api/admin/site/',headers:{'X-Forwarded-Proto':'https'}},r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: ${GHOST_MEM_LIMIT:-768m}
    mem_reservation: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: ghost_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD}
    volumes:
      - ghost_db:/var/lib/mysql
    networks:
      - backend
    # No auth-plugin override: Ghost 6's driver speaks MySQL 8's default
    # caching_sha2_password, and the old --default-authentication-plugin
    # flag is deprecated in 8.0 and makes MySQL 8.4 refuse to start.
    command:
      - '--performance-schema=OFF'
      - '--innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-128M}'
      - '--max-connections=50'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: ${DB_MEM_LIMIT:-512m}
    mem_reservation: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - SETFCAP
      - SYS_NICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
      TUNNEL_METRICS: 0.0.0.0:2000
    networks:
      - frontend
    depends_on:
      ghost:
        condition: service_healthy
    # No healthcheck: the distroless cloudflared image has no shell and no curl/wget.
    # restart: unless-stopped + tunnel reconnect logic is sufficient.
    mem_limit: ${CLOUDFLARED_MEM_LIMIT:-128m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Built-in send-only mail server (maddy). Enabled by the installer when you
  # choose "built-in" mail; it is off unless COMPOSE_PROFILES contains "mail".
  # No ports are published: only Ghost can reach it, over the `mail` network.
  mail:
    image: ${MAIL_IMAGE:-ghcr.io/foxcpp/maddy:0.9.7}
    container_name: ghost_mail
    restart: unless-stopped
    profiles: [mail]
    # maddy.conf delivers directly to recipients' MX servers;
    # maddy-relay.conf hands mail to MAIL_RELAY_HOST instead.
    entrypoint:
      - /bin/maddy
      - -config
      - /etc/maddy/maddy${MAIL_RELAY_HOST:+-relay}.conf
    command: [run]
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-${MAIL_DOMAIN:-}}
      MAIL_DKIM_SELECTOR: ${MAIL_DKIM_SELECTOR:-ghost}
      MAIL_RELAY_HOST: ${MAIL_RELAY_HOST:-}
      MAIL_RELAY_PORT: ${MAIL_RELAY_PORT:-587}
      MAIL_RELAY_USER: ${MAIL_RELAY_USER:-}
      MAIL_RELAY_PASSWORD: ${MAIL_RELAY_PASSWORD:-}
    volumes:
      - ./mail:/etc/maddy:ro
      # DKIM private key + outbound queue. Back this up (backup.sh does).
      - mail_data:/data
    networks:
      - mail
    healthcheck:
      test: ["CMD-SHELL", "printf 'QUIT\\r\\n' | nc -w 3 127.0.0.1 2525 | grep -q '^220'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: ${MAIL_MEM_LIMIT:-64m}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  ghost_content:
    driver: local
  ghost_db:
    driver: local
  mail_data:
    driver: local

networks:
  # frontend = ghost ↔ cloudflared (public ingress path).
  # backend  = ghost ↔ db          (data plane; cloudflared cannot reach MySQL).
  # mail     = ghost ↔ mail        (built-in relay; needs outbound internet).
  frontend:
    driver: bridge
  backend:
    driver: bridge
  mail:
    driver: bridge
