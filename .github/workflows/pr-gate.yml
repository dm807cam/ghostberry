name: PR-Gate

# Kostenloser Vorfilter vor der Claude-Triage (Haiku).
# Liest nur Metadaten über die GitHub-API und checkt NIEMALS Code aus dem PR aus,
# deshalb ist pull_request_target hier sicher.
#
# Ergebnis:
#   triage        -> Gate bestanden, die Haiku-Routine startet
#   gate-blocked  -> angehalten; zum Freigeben das Label 'triage' von Hand setzen
#   (kein Label)  -> Bots (z. B. Dependabot) und Entwürfe werden ignoriert

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: PR prüfen
        uses: actions/github-script@v8
        env:
          MIN_ACCOUNT_AGE_DAYS: '30'
          MAX_PRS_PER_AUTHOR_24H: '2'
          MAX_PRS_PER_REPO_1H: '5'
          MAX_CHANGED_LINES: '5000'
          MAX_CHANGED_FILES: '100'
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const login = pr.user.login;
            const existing = (pr.labels || []).map(l => l.name);
            const env = process.env;

            const done = ['triage', 'triaged', 'gate-blocked', 'spam'];
            if (existing.some(l => done.includes(l))) {
              core.info(`Bereits bearbeitet (${existing.join(', ')}) – nichts zu tun.`);
              return;
            }
            if (pr.user.type === 'Bot') {
              core.info(`Bot-PR von ${login} – keine Triage.`);
              return;
            }

            const reasons = [];
            let trusted = false;

            // Maintainer und Collaborators mit Schreibrechten passieren direkt.
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: login });
              trusted = ['admin', 'maintain', 'write'].includes(data.permission);
            } catch (e) {
              core.info(`Rechte von ${login} nicht lesbar: ${e.message}`);
            }

            if (!trusted) {
              const { data: user } = await github.rest.users.getByUsername({ username: login });
              const ageDays = (Date.now() - new Date(user.created_at)) / 86400000;
              if (ageDays < Number(env.MIN_ACCOUNT_AGE_DAYS)) {
                reasons.push(`Account ist erst ${ageDays.toFixed(0)} Tage alt (Minimum ${env.MIN_ACCOUNT_AGE_DAYS}).`);
              }

              const { data: recent } = await github.rest.pulls.list({
                owner, repo, state: 'all', sort: 'created', direction: 'desc', per_page: 100,
              });
              const now = Date.now();
              const byAuthor = recent.filter(p => p.user.login === login && now - new Date(p.created_at) < 86400000).length;
              const lastHour = recent.filter(p => p.user.type !== 'Bot' && now - new Date(p.created_at) < 3600000).length;
              if (byAuthor > Number(env.MAX_PRS_PER_AUTHOR_24H)) {
                reasons.push(`${login} hat in 24 h ${byAuthor} PRs geöffnet (Maximum ${env.MAX_PRS_PER_AUTHOR_24H}).`);
              }
              if (lastHour > Number(env.MAX_PRS_PER_REPO_1H)) {
                reasons.push(`Im Repo kamen in der letzten Stunde ${lastHour} PRs an (Maximum ${env.MAX_PRS_PER_REPO_1H}).`);
              }

              const lines = (pr.additions || 0) + (pr.deletions || 0);
              if (lines > Number(env.MAX_CHANGED_LINES) || (pr.changed_files || 0) > Number(env.MAX_CHANGED_FILES)) {
                reasons.push(`PR ist sehr groß (${lines} Zeilen, ${pr.changed_files} Dateien).`);
              }
            }

            const label = reasons.length ? 'gate-blocked' : 'triage';
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [label] });

            await core.summary
              .addHeading(`PR #${pr.number}: ${label}`)
              .addRaw(trusted ? 'Autor hat Schreibrechte – direkt freigegeben.' : '')
              .addList(reasons.length ? reasons : ['Alle Prüfungen bestanden.'])
              .write();
            core.info(`${label}${reasons.length ? ': ' + reasons.join(' ') : ''}`);
