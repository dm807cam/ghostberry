# Ghostberry built-in mail: SMARTHOST (relay) mode.
# Used when MAIL_RELAY_HOST is set in .env. Mail is DKIM-signed with your
# own key, then handed to your provider over STARTTLS on port 587 (or
# whatever MAIL_RELAY_PORT says). Use this when outbound port 25 is
# blocked or your home IP has a poor reputation.

import common

target.smtp outbound {
    # STARTTLS is mandatory; maddy will not fall back to plaintext.
    starttls yes
    auth plain {env:MAIL_RELAY_USER} {env:MAIL_RELAY_PASSWORD}
    targets tcp://{env:MAIL_RELAY_HOST}:{env:MAIL_RELAY_PORT}
}
