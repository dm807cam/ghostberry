# Ghostberry built-in mail: DIRECT delivery mode.
# Used when MAIL_RELAY_HOST is empty. Mail goes straight to each
# recipient's MX on port 25. Your network must allow outbound port 25
# (many home ISPs block it). If it does not, set MAIL_RELAY_HOST in .env
# to switch to maddy-relay.conf.

import common

target.remote outbound {
    limits {
        destination rate 10 1s
        destination concurrency 5
    }
    mx_auth {
        dane
        mtasts {
            cache fs
            fs_dir mtasts_cache/
        }
        local_policy {
            min_tls_level none
            min_mx_level none
        }
    }
}
