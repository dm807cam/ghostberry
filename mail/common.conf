# Ghostberry built-in mail: shared part of the maddy config.
# This is a SEND-ONLY relay. It never receives mail from the internet
# (no ports are published) and only accepts messages from containers on
# the private `mail` Docker network, i.e. Ghost.
#
# Values come from the container environment (set in docker-compose.yml
# from .env). Do not edit secrets in here.

$(hostname) = {env:MAIL_HOSTNAME}
$(primary_domain) = {env:MAIL_DOMAIN}

hostname $(hostname)
state_dir /data
runtime_dir /tmp

# The listener below is only reachable on the private Docker network, so it
# runs without TLS. Outbound connections still use TLS (see the outbound
# block in maddy.conf / maddy-relay.conf).
tls off

smtp tcp://0.0.0.0:2525 {
    limits {
        all rate 20 1s
        all concurrency 5
    }

    # Only mail *from* your own domain is accepted, so a compromised
    # container on the network can't use this relay to spoof others.
    source $(primary_domain) {
        default_destination {
            modify {
                # Signs every message. On first start maddy generates a
                # 2048-bit RSA key in /data/dkim_keys/ and writes the DNS
                # record to publish next to it (*.dns).
                # Print it with: ./scripts/mail-dns.sh
                dkim $(primary_domain) $(primary_domain) {env:MAIL_DKIM_SELECTOR}
            }
            deliver_to &remote_queue
        }
    }
    default_source {
        reject 553 5.7.1 "Sender domain not allowed by this relay"
    }
}

# Persistent queue: if the receiving server is down or greylists us, the
# message is retried with backoff instead of being lost.
target.queue remote_queue {
    target &outbound
    max_tries 12
    autogenerated_msg_domain $(primary_domain)
    bounce {
        # Ghost has no mailbox to receive bounces; failures are logged
        # (docker compose logs mail) instead of being mailed back.
        default_destination {
            reject 550 5.0.0 "Bounces are not delivered by this relay"
        }
    }
}
